[program:stack-bm]
command=/data/stack-bm/bin/stack-bm
directory=/data/stack-bm
user=root
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/data/stack-bm/logs/app.log
stderr_logfile=/data/stack-bm/logs/app_error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=APP_ENV="pro"
